<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — TibetRide Tibet tours">
  <meta name="robots" content="noindex">
  <title data-lang-zh="404 页面未找到 - TibetRide" data-lang-en="404 Not Found | TibetRide">404 Not Found | TibetRide</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/lang.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <script>
    (function(){
      var k='site-lang',l=localStorage.getItem(k);
      if(l==='en'){document.documentElement.setAttribute('lang','en');}
      else{document.documentElement.setAttribute('lang','zh-CN');}
    })();
  </script>
  <style>
    .error-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; background: #faf8f5; }
    .error-page__code { font-size: clamp(6rem, 15vw, 12rem); font-weight: 800; color: #b91c1c; line-height: 1; margin-bottom: 0.5rem; }
    .error-page__title { font-size: 1.5rem; font-weight: 700; color: #1c1917; margin-bottom: 0.75rem; }
    .error-page__desc { font-size: 1rem; color: #78716c; max-width: 480px; margin-bottom: 2rem; line-height: 1.6; }
    .error-page__links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    .error-page__links a { display: inline-block; padding: 0.7rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: all 0.2s; }
    .btn-primary { background: #b91c1c; color: #fff; }
    .btn-primary:hover { background: #991b1b; }
    .btn-outline { border: 2px solid #d6d3d1; color: #44403c; background: #fff; }
    .btn-outline:hover { border-color: #b91c1c; color: #b91c1c; }
  </style>
</head>
<body>
<div class="error-page">
  <div class="error-page__code">404</div>
  <div class="lang-content" data-lang="zh">
    <h1 class="error-page__title">页面未找到</h1>
    <p class="error-page__desc">抱歉，您访问的页面不存在或已被移动。也许下面的链接可以帮到您。</p>
  </div>
  <div class="lang-content" data-lang="en">
    <h1 class="error-page__title">Page Not Found</h1>
    <p class="error-page__desc">Sorry, the page you're looking for doesn't exist or has been moved. These links might help.</p>
  </div>
  <div class="error-page__links">
    <a href="/" class="btn-primary" data-lang-zh="回到首页" data-lang-en="Back to Home">Back to Home</a>
    <a href="/tours" class="btn-outline" data-lang-zh="查看旅行线路" data-lang-en="Browse Tours">Browse Tours</a>
    <a href="/articles" class="btn-outline" data-lang-zh="阅读旅行攻略" data-lang-en="Travel Guides">Travel Guides</a>
    <a href="/contact" class="btn-outline" data-lang-zh="联系我们" data-lang-en="Contact Us">Contact Us</a>
  </div>
</div>
<script src="js/main.js"></script>
<script src="js/lang.js"></script>
</body>
</html>
